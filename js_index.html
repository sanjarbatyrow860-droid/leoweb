<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sanjar's site</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="jquery-3.4.1.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <header id="site-header">
        <div class="container-fluid py-2">
            <div class="row align-items-center">
                <div class="col-auto">
                    <a href="/leoweb/">
                        <img class="logo rounded-circle" src="images/logo.png" alt="Логотип сайта" />
                    </a>
                </div>

                <h1 class="col site-title mb-0">Суетной сайт</h1>

                <nav id="site-nav" class="col-12 col-md-auto mt-2 mt-md-0">
                    <ul class="nav flex-column flex-md-row justify-content-md-end">
                        <li class="nav-item"><a class="nav-link" href="/leoweb/"> Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="/leoweb/#table-section"> Таблица</a></li>
                        <li class="nav-item"><a class="nav-link" href="/leoweb/#form-section"> Форма</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main id="content" class="container py-3">

        <h1>Калькулятор стоимости заказа</h1>

        <form id="calc-form">
            <div id="order"></div>
            <p>
                <button id="add-button" type="button">Добавить товар</button>
                <button id="calc-button" type="button">Рассчитать</button>
            </p>
        </form>
        <p id="result" aria-live="polite"></p>

        <hr>

        <h1>Калькулятор стоимости услуги</h1>

        <form id="service-form">
            <p>
                <label for="service-quantity">Количество:</label>
                <input id="service-quantity" type="text" value="1" size="6" autocomplete="off">
                <span id="service-error" class="text-danger"></span>
            </p>

            <fieldset class="mb-3">
                <legend class="h6">Тип услуги</legend>
                <label class="mr-3"><input type="radio" name="serviceType" value="consulting" checked> Консультация — 1000 руб.</label>
                <label class="mr-3"><input type="radio" name="serviceType" value="layout"> Вёрстка страницы — 3000 руб.</label>
                <label class="mr-3"><input type="radio" name="serviceType" value="support"> Поддержка сайта — 2000 руб.</label>
            </fieldset>

            <p id="service-options" hidden>
                <label for="service-select">Вариант вёрстки:</label>
                <select id="service-select" name="serviceOption">
                    <option value="standard">Обычная — +0 руб.</option>
                    <option value="responsive">Адаптивная — +1000 руб.</option>
                    <option value="animated">Адаптивная с анимацией — +2500 руб.</option>
                </select>
            </p>

            <p id="service-property" hidden>
                <label><input id="service-property-checkbox" type="checkbox" name="serviceProperty"> Круглосуточная поддержка — +500 руб.</label>
            </p>
        </form>
        <p id="service-result" class="font-weight-bold" aria-live="polite"></p>

        <hr>

        <h1>Галерея</h1>

        <div id="gallery" class="gallery">
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 1"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 2"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 3"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 4"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 5"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 6"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 7"></div>
            <div class="gallery-item"><img src="images/kub.jpg" alt="Картина 8"></div>
        </div>
    </main>
    <footer id="site-footer" class="text-center py-3 px-3">
        <p class="mb-0">&copy; Visca Barca</p>
    </footer>
</body>
</html>
